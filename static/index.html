<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeatNav · Feldberg</title>
<meta name="description" content="Live map of free study carrels in Feldberg Library">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<!-- three.js for the 3D map (floor.js), pinned to one version on the jsDelivr CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<style>
  /* Colours live here as tokens; floor.js reads the --scene-* and state ones for the 3D view.
     State colours are tuned so free and occupied also differ in lightness, for colour-blind users;
     every state also has its own icon and its own furniture in the map. */
  :root {
    color-scheme: light;
    --bg: #eef0ec;
    --surface: #ffffff;
    --text: #18201b;
    --muted: #59645e;
    --line: #d9dfda;
    --brand: #00693e;
    --on-brand: #ffffff;
    --free: #16a35f;
    --occupied: #c8322b;
    --away: #e9a514;
    --offline: #8a918d;
    --inactive: #c3c8c5;
    --ink-free: #04170b;
    --ink-occupied: #ffffff;
    --ink-away: #221800;
    --ink-offline: #0b0e0c;
    --ink-inactive: #2a312d;
    --scene-bg: #e3e7e2;
    --scene-floor: #70767a;            /* the library's charcoal carpet */
    --label-bg: rgba(255, 255, 255, 0.82);
    --room-top: #eef1f4;               /* closed rooms: grey gradient, top to floor */
    --room-bottom: #aab3bb;
    --scene-carpet: #5b6266;
    --scene-wall: #fdfdfb;
    --scene-wall-top: #2c332f;
    --scene-ghost: #cdd2cf;
    --shadow: 0 6px 24px rgba(20, 30, 25, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0f1311;
      --surface: #1a201c;
      --text: #e7ece8;
      --muted: #9ba69f;
      --line: #2c3530;
      --brand: #4fb386;
      --on-brand: #06150d;
      --free: #43d68a;
      --occupied: #ff5d4f;
      --away: #ffc23d;
      --offline: #7d8682;
      --inactive: #4a514d;
      --ink-free: #04170b;
      --ink-occupied: #1f0705;
      --ink-away: #221800;
      --ink-offline: #0b0e0c;
      --ink-inactive: #e7ece8;
      --scene-bg: #0b0f0d;
      --scene-floor: #3b4246;
      --label-bg: rgba(15, 19, 17, 0.78);
      --room-top: #737c84;
      --room-bottom: #30363b;
      --scene-carpet: #1b1f21;
      --scene-wall: #3c443f;
      --scene-wall-top: #a9b4ae;
      --scene-ghost: #3b423e;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- 3D map ---------- */
  .scene { position: fixed; inset: 0; }
  .scene canvas { display: block; }
  .labels { position: absolute; top: 0; left: 0; pointer-events: none; }
  .room-label {
    max-width: 130px;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--label-bg);
    text-align: center;
    font: 600 10px/1.2 system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }
  .entrance-label, .zone-tag {
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface);
    font: 700 12px/1 system-ui, sans-serif;
    white-space: nowrap;
  }
  .entrance-label { color: var(--brand); box-shadow: var(--shadow); }
  .zone-tag { color: var(--muted); border: 1px dashed var(--muted); font-weight: 600; }
  .pin {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px 3px 5px;
    border: 2px solid var(--surface);
    border-radius: 999px;
    background: var(--c);
    color: var(--ink);
    font: 700 13px/1 system-ui, sans-serif;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  .pin svg { width: 15px; height: 15px; }
  .pin.selected { outline: 3px solid var(--text); outline-offset: 1px; }

  /* ---------- state colours, shared by pins, badges, list rows and the usage bar ---------- */
  [data-state="FREE"] { --c: var(--free); --ink: var(--ink-free); }
  [data-state="OCCUPIED"] { --c: var(--occupied); --ink: var(--ink-occupied); }
  [data-state="AWAY"] { --c: var(--away); --ink: var(--ink-away); }
  [data-state="OFFLINE"] { --c: var(--offline); --ink: var(--ink-offline); }
  [data-state="INACTIVE"] { --c: var(--inactive); --ink: var(--ink-inactive); }
  .badge {
    flex: none;
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--c);
    color: var(--ink);
  }
  .badge svg { width: 62%; height: 62%; }

  /* ---------- header ---------- */
  .top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    padding: calc(12px + env(safe-area-inset-top)) 16px 28px;
    background: linear-gradient(var(--bg) 62%, transparent);
    pointer-events: none;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { margin: 0; font-size: 15px; font-weight: 700; color: var(--brand); }
  .where { margin-left: 6px; font-weight: 500; color: var(--muted); }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--offline); }
  .conn.ok::before { background: var(--free); }
  .hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .hero { margin: 10px 0 0; font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; }
  .find {
    pointer-events: auto;
    flex: none;
    min-height: 40px;
    padding: 0 14px;
    border: 0;
    border-radius: 999px;
    background: var(--brand);
    color: var(--on-brand);
    font-size: 14px;
    font-weight: 700;
    box-shadow: var(--shadow);
  }
  .toast {
    position: fixed;
    top: calc(128px + env(safe-area-inset-top));
    left: 50%;
    z-index: 5;
    transform: translateX(-50%);
    max-width: min(92vw, 460px);
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .hero b { color: var(--free); font-weight: 750; }
  .tally { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

  /* ---------- list (also the fallback without WebGL) ---------- */
  .list {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow-y: auto;
    padding: calc(140px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .list-open .list { display: block; }
  .list > * { max-width: 520px; margin-left: auto; margin-right: auto; }
  .summary { margin-bottom: 14px; }
  .summary .bar { height: 10px; margin-bottom: 8px; }
  .summary p { margin: 0; font-size: 14px; color: var(--muted); }
  .tiles { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; padding: 0; }
  .tile {
    width: 100%;
    min-height: 104px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 12px;
    border: 1px solid var(--line);
    border-top: 5px solid var(--c);
    border-radius: 14px;
    background: var(--surface);
    text-align: left;
  }
  .tile-num { font-size: 18px; font-weight: 750; line-height: 1.1; }
  .tile-state { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 650; }
  .tile-state .badge { width: 20px; height: 20px; }
  .tile-sub { font-size: 12px; color: var(--muted); }
  .soon {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding: 12px 14px;
    border: 1px dashed var(--muted);
    border-radius: 14px;
    font-size: 14px;
    color: var(--muted);
  }
  .soon[hidden] { display: none; }
  .soon .badge { width: 22px; height: 22px; }
  .debug { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  .debug dt { color: var(--muted); }
  .debug dd { margin: 0; font-variant-numeric: tabular-nums; }

  /* ---------- place picker ---------- */
  .place-btn {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 6px 0;
    border: 0;
    background: none;
    font-size: 15px;
    font-weight: 700;
    color: var(--brand);
  }
  .place-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--text); }
  .place-btn svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
  .test-badge { flex: none; padding: 2px 8px; border-radius: 999px; background: var(--away); color: var(--ink-away); font-size: 11px; font-weight: 800; }
  .places {
    position: fixed;
    inset: 0;
    z-index: 6;
    overflow-y: auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .places > *, .places h3, .places ul { max-width: 520px; margin-left: auto; margin-right: auto; }
  .places-head { display: flex; justify-content: space-between; align-items: center; }
  .places-head h2 { margin: 0; font-size: 26px; }
  .places h3 { margin-top: 22px; margin-bottom: 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .places ul { list-style: none; display: grid; gap: 8px; padding: 0; }
  .place {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    text-align: left;
  }
  .place:disabled { opacity: 0.55; cursor: default; }
  .place-main { flex: 1; min-width: 0; display: grid; }
  .place-main small { font-size: 13px; color: var(--muted); }
  .pill { flex: none; padding: 3px 10px; border-radius: 999px; background: var(--line); color: var(--muted); font-size: 12px; font-weight: 700; }
  .pill.live { background: var(--free); color: var(--ink-free); }
  .pill.current { background: var(--brand); color: var(--on-brand); }
  .note { padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }

  /* ---------- seat detail sheet ---------- */
  .sheet {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: calc(112px + env(safe-area-inset-bottom));
    z-index: 4;
    max-width: 520px;
    max-height: 52vh;
    margin: 0 auto;
    overflow-y: auto;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 { margin: 0; font-size: 22px; }
  .sheet h3 { margin: 18px 0 8px; font-size: 14px; }
  .icon-btn { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: transparent; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 10px 0 4px;
    padding: 4px 12px 4px 6px;
    border-radius: 999px;
    background: var(--c);
    color: var(--ink);
    font-weight: 700;
  }
  .chip svg { width: 18px; height: 18px; }
  .bar { display: flex; height: 12px; margin-bottom: 6px; overflow: hidden; border-radius: 6px; background: var(--line); }
  .bar span { background: var(--c); }
  .changes { list-style: none; display: grid; gap: 6px; margin: 0; padding: 0; }
  .changes li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .changes time { width: 46px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .changes .badge { width: 20px; height: 20px; }
  .muted { margin: 0; font-size: 14px; color: var(--muted); }

  /* ---------- bottom bar ---------- */
  .bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 18px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 38%);
  }
  .legend {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 12px;
    margin: 0 0 8px;
    padding: 0;
    font-size: 12px;
    color: var(--muted);
  }
  .legend li { display: inline-flex; align-items: center; gap: 5px; }
  .legend .badge { width: 18px; height: 18px; }
  .views {
    display: flex;
    gap: 4px;
    max-width: 520px;
    margin: 0 auto;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .views button {
    flex: 1;
    min-height: 40px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
  }
  .views button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .no-3d .views [data-view] { display: none; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="scene" class="scene" aria-hidden="true"></div>

<header class="top">
  <div class="top-row">
    <button id="placeBtn" class="place-btn" type="button" aria-label="Choose a place">
      SeatNav <span id="placeName">…</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="testBadge" class="test-badge" hidden>Testing</span>
    <span id="conn" class="conn">Connecting…</span>
  </div>
  <div class="hero-row">
    <p class="hero"><b id="freeCount">–</b> <span id="freeText">carrels free</span></p>
    <button id="findBtn" class="find" type="button">Find a seat</button>
  </div>
  <p id="tally" class="tally"></p>
</header>

<button id="toast" class="toast" type="button" hidden></button>

<section id="list" class="list" aria-label="Seats">
  <p id="fallbackNote" class="note" hidden>The 3D map isn't available on this device.</p>
  <div id="listSummary" class="summary"></div>
  <ul id="listItems" class="tiles"></ul>
  <p id="listSoon" class="soon" hidden></p>
  <p id="listDebug" class="muted" hidden></p>
</section>

<section id="places" class="places" hidden aria-label="Choose a place">
  <div class="places-head">
    <h2>Places</h2>
    <button id="placesClose" class="icon-btn" type="button" aria-label="Close">✕</button>
  </div>
  <div id="placesBody"></div>
</section>

<section id="sheet" class="sheet" hidden aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" class="icon-btn" type="button" aria-label="Close">✕</button>
  </div>
  <p id="sheetState" class="chip"></p>
  <p id="sheetSince" class="muted"></p>
  <div id="sheetBody"></div>
</section>

<footer class="bottom">
  <ul id="legend" class="legend" aria-label="Legend"></ul>
  <nav class="views" aria-label="Map views">
    <button type="button" data-view="carrels" aria-pressed="true">Seats</button>
    <button type="button" data-view="floor" aria-pressed="false">Whole floor</button>
    <button type="button" data-view="top" aria-pressed="false">Top-down</button>
    <button type="button" id="listBtn" aria-pressed="false">List</button>
  </nav>
</footer>

<p id="announce" class="sr-only" aria-live="polite"></p>

<script type="module" src="/static/app.js"></script>
</body>
</html>
